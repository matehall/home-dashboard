# Körs på Raspberry Pi. Lägg .env bredvid denna fil (se server/.env.example).
services:
  home-dashboard:
    image: ghcr.io/matehall/home-dashboard:latest
    container_name: home-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./data:/app/server/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Förhandsvisning på port 3001: senaste bygget (PR eller main) tagg `preview`, uppdateras av Watchtower
  # innan en PR mergas. Egen databas; Roborock/NexBlue är avstängda så de inte pollas dubbelt.
  home-dashboard-preview:
    image: ghcr.io/matehall/home-dashboard:preview
    container_name: home-dashboard-preview
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      ROBOROCK_IP: ""
      ROBOROCK_TOKEN: ""
      NEXBLUE_USERNAME: ""
      NEXBLUE_PASSWORD: ""
      TUYA_POLL_SECONDS: "60"
    volumes:
      - ./data-preview:/app/server/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    command: --label-enable --interval 300 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Om imagen är privat: docker login ghcr.io och montera config
      # - /home/pi/.docker/config.json:/config.json:ro
